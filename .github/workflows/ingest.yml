name: Ingest Wiki Sources

on:
  push:
    paths:
      - 'raw/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Ingest Command
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python workflow.py ingest

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated Ingestion Run: Update wiki files"
          file_pattern: 'wiki/**'
